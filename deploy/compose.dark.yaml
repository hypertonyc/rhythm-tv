# Второй экземпляр сервера РЯДОМ с боевым — для обкатки версии на живых данных.
#
# Использовался при переезде с Node (16.08.2026) и остаётся на случай, когда
# новую сборку хочется проверить на телевизоре, не трогая работающую: боевой
# остаётся на 8000, тёмный встаёт на 8001, у каждого свои тома и свой порт
# для пиров. В nginx для него заводится параллельный путь, переключение потом —
# правка одной строки, она же и откат.
#
#   docker compose -p tms-dark -f /srv/rhythm-tv/deploy/compose.dark.yaml \
#     --env-file /srv/rhythm-tv/deploy/.env.dark up -d
#
# Хранилище у тёмного экземпляра своё и пустое: два торрент-клиента, пишущих
# в один каталог, испортили бы его друг другу. Значит он докачивает то, что
# понадобится для проверки, — это нормально и временно.

name: tms-dark

services:
  server:
    image: ${SERVER_IMAGE:?SERVER_IMAGE обязателен}:${SERVER_TAG:?SERVER_TAG обязателен}
    container_name: tms-server-dark
    # Пустое значение допустимо: каталог библиотеки задан через TORRENT_LIB,
    # а активный торрент помнится в /data/.tms-active.
    command: ["${TORRENT_FILE:-}"]
    restart: unless-stopped
    stop_grace_period: 15s

    ports:
      - "127.0.0.1:${HOST_PORT:-8001}:8000"
      # Порт для пиров обязан отличаться от боевого: у anacrolix значение
      # по умолчанию фиксированное, и второй экземпляр иначе не стартует.
      - "${TORRENT_PORT:-42070}:${TORRENT_PORT:-42070}"
      - "${TORRENT_PORT:-42070}:${TORRENT_PORT:-42070}/udp"

    environment:
      PORT: "8000"
      TORRENT_PORT: "${TORRENT_PORT:-42070}"
      TORRENT_LIB: /data
      # Тома СВОИ, не общие с боевым сервером: два торрент-клиента, пишущих
      # в одно хранилище, испортили бы его друг другу.
      TORRENT_STORE: /var/lib/tms/store
      TMPDIR: /var/lib/tms/hls
      TORRENT_STORE_PERSIST: "1"
      HLS_ALLOW_COPY: "${HLS_ALLOW_COPY:-1}"

    volumes:
      # Каталог библиотеки общий с боевым и НЕ :ro: тёмный экземпляр должен
      # уметь принять загрузку. Внимание: .tms-active тоже общий, и смена
      # активного торрента в тёмном экземпляре меняет его и для боевого.
      - ${TORRENT_DIR:?TORRENT_DIR обязателен}:/data
      - dark-store:/var/lib/tms/store
      - dark-hls:/var/lib/tms/hls

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          # Вдвое скромнее боевых: пока идёт проверка, приоритет у живого сервера.
          cpus: "${CPU_LIMIT:-1.5}"
          memory: ${MEM_LIMIT:-1g}
          pids: 512

    # Защита выровнена с прежним боевым контейнером на Node: он работал
    # именно так, и слабее делать незачем. Образ собран под uid 10001 —
    # это тот же rhythm, что владеет /srv/rhythm-tv на хосте. Без совпадения
    # uid контейнер с cap_drop: ALL не прочитает .torrent: без CAP_DAC_OVERRIDE
    # даже root не обходит права -r--r-----.
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  dark-store:
  dark-hls:
