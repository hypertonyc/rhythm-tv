# Прод-конфигурация для VPS.
#
# Приезжает по SSH на stdin при каждом деплое и ложится на VPS
# как /srv/rhythm-tv/deploy/compose.yaml. Все значения — из соседнего .env,
# которого в git нет (шаблон — .env.example).
name: tms

services:
  server:
    image: ${SERVER_IMAGE:?SERVER_IMAGE обязателен}:${SERVER_TAG:?SERVER_TAG обязателен}
    container_name: tms-server

    # Единственный аргумент сервера — путь к .torrent ВНУТРИ контейнера.
    # `:?` здесь не педантизм: без него получилось бы command: [""], сервер
    # напечатал бы Usage и вышел с кодом 1 — прямо в перезапускающийся цикл.
    command: ["${TORRENT_FILE:?TORRENT_FILE обязателен}"]

    restart: unless-stopped

    # shutdown() убивает ffmpeg и уходит по 5-секундному сторожевому таймеру,
    # так что 15 с хватает с запасом и до SIGKILL дело не доходит.
    stop_grace_period: 15s

    ports:
      # ТОЛЬКО loopback. Docker вписывает свои DNAT-правила в цепочку DOCKER,
      # которая проходится ДО правил ufw, поэтому `ufw deny 8000` скорее всего
      # ничего не закрывает. А своей авторизации у сервера нет вообще —
      # снаружи его публикует reverse-proxy с токеном в пути.
      - "127.0.0.1:${HOST_PORT:-8000}:8000"
      # Порт для входящих пиров — этот наружу открыт намеренно.
      - "${TORRENT_PORT:-42069}:${TORRENT_PORT:-42069}"
      - "${TORRENT_PORT:-42069}:${TORRENT_PORT:-42069}/udp"

    environment:
      PORT: "8000"
      TORRENT_PORT: "${TORRENT_PORT:-42069}"
      # Оба рабочих каталога уводим с overlayfs контейнера на именованные тома.
      TORRENT_STORE: /var/lib/tms/store
      TMPDIR: /var/lib/tms/hls
      HLS_ALLOW_COPY: "${HLS_ALLOW_COPY:-1}"
      # Без этого каждый деплой стирал бы уже скачанное — а там десятки
      # гигабайт, и качать их заново пришлось бы сутками.
      TORRENT_STORE_PERSIST: "1"
      # Разовая проверка хэшей — нужна при переезде с Node: раскладка файлов
      # на диске совпадает, но база готовности кусков у anacrolix своя и пустая,
      # и без проверки все уже скачанные гигабайты сочлись бы отсутствующими.
      # После успешного переезда вернуть в 0: проверка стоит пары минут
      # на каждом старте.
      TORRENT_VERIFY_ON_START: "${TORRENT_VERIFY_ON_START:-0}"
      PROBE_TIMEOUT_MS: "${PROBE_TIMEOUT_MS:-25000}"

    volumes:
      - ${TORRENT_DIR:?TORRENT_DIR обязателен}:/data:ro # только .torrent, только чтение
      # Bind-монтирования, а не именованные тома: на VPS уже лежат десятки
      # гигабайт по этим путям, и раскладка на диске у anacrolix совпадает
      # с webtorrent (<хранилище>/<имя торрента>/<путь>) — данные переезжают
      # как есть, нужна лишь разовая проверка хэшей (TORRENT_VERIFY_ON_START).
      - ${STORE_DIR:?STORE_DIR обязателен}:/var/lib/tms/store
      - ${HLS_DIR:?HLS_DIR обязателен}:/var/lib/tms/hls

    # healthcheck не дублируется: он объявлен в самом образе
    # (`server -healthcheck`, бьёт в /api/status).

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          # Ниже ~2.0 realtime-транскод libx264 не тянет, а это весь продукт.
          cpus: "${CPU_LIMIT:-3.0}"
          memory: ${MEM_LIMIT:-2g}
          # Здесь, а не отдельным pids_limit: compose сводит их в одно поле
          # и падает, если заданы оба.
          pids: 512

    # Защита выровнена с прежним боевым контейнером на Node: он работал
    # именно так, и слабее делать незачем. Образ собран под uid 10001 —
    # это тот же rhythm, что владеет /srv/rhythm-tv на хосте. Без совпадения
    # uid контейнер с cap_drop: ALL не прочитает .torrent: без CAP_DAC_OVERRIDE
    # даже root не обходит права -r--r-----.
    read_only: true
    init: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

# Про сегменты HLS: tmpfs здесь был бы ошибкой. Сегменты 45-минутной серии —
# это 0.8-1.2 ГБ, а в режиме copy на высокобитрейтном исходнике до 3-6 ГБ,
# и скользящего окна нет: счётчик идёт вверх, старые .ts не удаляются до конца
# сеанса. tmpfs на 2 ГБ (а) съел бы RAM, которую лучше отдать под страничный
# кэш торрента, и (б) упал бы с ENOSPC ПОСРЕДИ СЕРИИ — ffmpeg умирает, сеанс
# уходит в error, зритель на 25-й минуте. Это строго хуже, чем «кончается
# диск», потому что гарантированно, а не условно.
