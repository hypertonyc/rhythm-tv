# Сборка сервера и, для main, автоматический деплой.
#
# Разделение на два файла несущее: откат не должен требовать пересборки.
# deploy.yml принимает тег образа входным параметром, поэтому откатиться —
# это один `gh workflow run deploy.yml -f image_tag=<sha>`, а не повторный
# прогон вчерашней сборки.
name: server

on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'deploy/**'
      - '.github/workflows/server.yml'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'deploy/**'
      - '.github/workflows/server.yml'
  workflow_dispatch:

concurrency:
  group: server-build-${{ github.ref }}
  # Сборку main не отменяем: её тег :<sha> — это то, на что ссылается деплой.
  # А вот устаревшие сборки PR отменять можно и нужно.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}/server

jobs:
  test:
    name: тесты
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: gofmt
        working-directory: server
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::требуется gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        working-directory: server
        run: go vet ./...

      # -race обязателен: всё состояние сеансов лежит под одним мьютексом,
      # и гонка тут проявилась бы только в проде под нагрузкой.
      - name: go test -race
        working-directory: server
        run: go test -race -count=1 ./...

      # tms-deploy лежит без расширения .sh и в client.yml не попадает,
      # а меняется он вместе с deploy/** — то есть вместе с этим workflow.
      - name: shellcheck скрипта деплоя
        run: shellcheck deploy/tms-deploy

      # Пока Node-эталон в дереве, проверяем и его синтаксис: golden-файлы
      # тестов сгенерированы из его строк, и сломанный эталон обесценивает их.
      - name: синтаксис Node-эталона
        run: |
          if [ -f server/legacy/server.mjs ]; then
            node --check server/legacy/server.mjs
          else
            echo "эталон удалён — пропускаем"
          fi

  build:
    name: образ в GHCR
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Голый sha коммита — единственный тег, которым пользуется деплой:
          # он неизменяем, и `docker compose ps` на VPS называет точный коммит.
          # latest существует только для рук; деплоить его нельзя.
          # Семвер через type=match, а не type=semver: репозиторий общий
          # с клиентом, и голый v1.2.3 был бы двусмысленным.
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=pr
            type=match,pattern=server-v(\d+\.\d+\.\d+),group=1
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Rhythm TV media server (torrent -> HLS)

      - uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Кэш обязательно со scope: без него ветки PR и main вытесняют друг
          # друга из 10 ГБ кэша, и слой apt-get install ffmpeg пересобирается
          # каждый раз — а он самый дорогой.
          cache-from: |
            type=gha,scope=server-${{ github.ref_name }}
            type=gha,scope=server-main
          cache-to: type=gha,mode=max,scope=server-${{ github.ref_name }}
          # Аттестации добавляют в список пакетов GHCR записи unknown/unknown
          # ради SLSA-провенанса, который тут никто не потребляет.
          provenance: false

      - name: итог
        if: github.event_name != 'pull_request'
        run: |
          {
            echo '### Собрано'
            echo '```'
            echo '${{ steps.meta.outputs.tags }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: деплой
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    uses: ./.github/workflows/deploy.yml
    with:
      image_tag: ${{ github.sha }}
    secrets: inherit
