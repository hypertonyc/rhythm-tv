# Дешёвый детерминированный скан на то, что не должно попадать в репозиторий.
#
# Приватные репозитории на бесплатном тарифе не получают push protection от
# GitHub, поэтому проверка своя. Она срабатывает УЖЕ ПОСЛЕ пуша, так что
# парная ей защита — локальный pre-commit-хук (см. раздел CI в CLAUDE.md).
name: secrets

on: [push, pull_request]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: секреты известной формы не должны попадать в git
        env:
          PROD_HOST_PATTERN: ${{ vars.PROD_HOST_PATTERN }}
        run: |
          set -uo pipefail
          bad=0

          # Токен обратного прокси — 48 hex-символов. Комментарии и go.sum
          # исключены: там длинные hex-строки легитимны.
          if git grep -I -nE '[0-9a-f]{40,}' -- \
               ':!*.png' ':!.git*' ':!server/go.sum' ':!**/testdata/**' \
               | grep -vE ':[0-9]+:[[:space:]]*(#|//|\*)'; then
            echo '::error::в отслеживаемых файлах есть строка из 40+ hex-символов (токен прокси — 48)'
            bad=1
          fi

          # Имя прод-хоста берётся из переменной репозитория, а не пишется
          # здесь: репозиторий публичный, и хардкодить в нём адрес прода —
          # ровно то, от чего эта проверка и защищает. Переменные видны
          # только тем, у кого есть доступ на запись.
          #   gh variable set PROD_HOST_PATTERN --body 'example'
          if [ -n "${PROD_HOST_PATTERN}" ]; then
            if git grep -I -ni "$PROD_HOST_PATTERN" -- ':!.github/**'; then
              echo '::error::в отслеживаемых файлах есть адрес прода'
              bad=1
            fi
          else
            echo 'PROD_HOST_PATTERN не задан — проверка на адрес прода пропущена'
          fi

          # Файл, который обязан быть в .gitignore, но оказался добавлен.
          if git ls-files | grep -E '(^|/)\.env$|/config\.js$|\.wgt$|\.torrent$'; then
            echo '::error::под контроль версий попал файл, которого там быть не должно'
            bad=1
          fi

          exit $bad
